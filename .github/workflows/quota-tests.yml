name: Quota safety
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quota_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GOOGLE_API_KEY: test
      JWT_SECRET_KEY: test-secret-at-least-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/quota_test
      QUOTA_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/quota_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run python -m unittest discover -s tests
      - run: uv run alembic downgrade b02c738c8086
      - run: uv run alembic upgrade head
